<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韦史妈妈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F8F9FA;
      --bg-card: #FFFFFF;
      --bg-toolbar: #F1F3F5;
      --fg-primary: #212529;
      --fg-secondary: #6C757D;
      --border: #DEE2E6;
      --accent: #495057;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--fg-primary);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-2px); }
    }

    .chat-bubble { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .thinking-dot { animation: dotBounce 1.2s infinite ease-in-out; }
    .thinking-dot:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.3s; }

    /* ========== 主布局：左窄栏 + 右侧 ========== */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: visible;
    }

    /* ========== 左侧人物窄栏 ========== */
    .sidebar {
      flex: 2;
      min-width: 0;
      background: var(--bg-secondary);
      border-right: 2px solid var(--fg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .sidebar img {
      width: 70%;
      height: auto;
      object-fit: contain;
      display: block;
      margin: auto;
    }

    /* ========== 右侧主区域 ========== */
    .main-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: visible;
    }

    /* 对话区 */
    .chat-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-bottom: 2px solid var(--fg-primary);
    }

    .message-group {
      display: flex;
      gap: 12px;
      max-width: 100%;
    }

    .message-group.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 500;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .bubble.ai {
      background: var(--bg-secondary);
      color: var(--fg-primary);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .bubble.user {
      background: var(--accent);
      color: var(--bg-primary);
      border-bottom-right-radius: 4px;
    }

    .bubble.error {
      background: #FFF0F0;
      border: 1px solid #FF0000;
      color: #FF0000;
    }

    /* Markdown 样式 */
    .bubble.ai h1, .bubble.ai h2, .bubble.ai h3, .bubble.ai h4 {
      margin: 8px 0 4px;
      font-weight: 600;
      line-height: 1.4;
    }
    .bubble.ai h1 { font-size: 1.4em; }
    .bubble.ai h2 { font-size: 1.3em; }
    .bubble.ai h3 { font-size: 1.2em; }
    .bubble.ai h4 { font-size: 1.1em; }
    .bubble.ai p { margin: 4px 0; }
    .bubble.ai strong { font-weight: 700; }
    .bubble.ai em { font-style: italic; }
    .bubble.ai ul, .bubble.ai ol {
      margin: 4px 0;
      padding-left: 20px;
    }
    .bubble.ai li { margin: 2px 0; }
    .bubble.ai ul { list-style: disc; }
    .bubble.ai ol { list-style: decimal; }
    .bubble.ai code {
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .bubble.ai pre {
      background: rgba(0, 0, 0, 0.08);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble.ai pre code {
      background: none;
      padding: 0;
    }
    .bubble.ai blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--fg-secondary);
    }
    .bubble.ai a {
      color: #0066cc;
      text-decoration: underline;
    }
    .bubble.ai hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }
    .bubble.ai img {
      max-width: 100%;
      border-radius: 4px;
      margin: 6px 0;
    }
    .bubble.ai table {
      border-collapse: collapse;
      margin: 8px 0;
      width: 100%;
    }
    .bubble.ai th, .bubble.ai td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .bubble.ai th {
      background: rgba(0, 0, 0, 0.04);
      font-weight: 600;
    }

    .timestamp {
      font-size: 11px;
      color: var(--fg-secondary);
      margin-top: 4px;
    }

    .message-meta {
      display: flex;
      flex-direction: column;
    }

    .message-group.user .message-meta {
      align-items: flex-end;
    }

    /* 思考气泡 */
    .thinking-bubble {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }

    /* ========== 输入区 ========== */
    .input-area {
      padding: 20px 24px;
      background: var(--bg-card);
      overflow: visible;
    }

    .input-container {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      overflow: visible;
    }

    .input-field {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--fg-primary);
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--fg-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: all 0.2s ease;
      min-height: 46px;
      max-height: 120px;
      line-height: 1.5;
    }

    .input-field:focus {
      box-shadow: 0 0 0 2px rgba(73, 80, 87, 0.15);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--bg-primary);
      border: 2px solid var(--fg-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #343a40;
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 加号按钮容器 */
    .add-btn-container {
      position: relative;
    }

    /* 加号按钮 */
    .add-btn {
      width: 46px;
      height: 46px;
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--fg-primary);
      border: 2px solid var(--fg-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      padding: 0;
    }

    .add-btn:hover {
      background: var(--bg-secondary);
      transform: translateY(-1px);
    }

    /* 弹出菜单 */
    .popup-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scaleY(0);
      transform-origin: bottom center;
      background: var(--bg-card);
      border: 1px solid var(--fg-primary);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      min-width: 140px;
      padding: 6px;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .popup-menu.active {
      transform: translateX(-50%) scaleY(1);
      opacity: 1;
      visibility: visible;
    }

    .popup-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: none;
      color: var(--fg-primary);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s ease;
      text-align: left;
    }

    .popup-item:hover {
      background: var(--bg-secondary);
    }

    .popup-item svg {
      flex-shrink: 0;
    }

    .popup-item input[type="file"] {
      display: none;
    }

    .popup-arrow {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: var(--bg-card);
      border-right: 1px solid var(--fg-primary);
      border-bottom: 1px solid var(--fg-primary);
      transform: translateX(-50%) rotate(45deg);
      margin-top: -5px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .popup-menu.active .popup-arrow {
      opacity: 1;
      visibility: visible;
    }

    /* 图片预览区 */
    .image-preview-area {
      display: none;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .image-preview-area.active {
      display: flex;
    }

    .image-thumb {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid var(--fg-primary);
    }

    .image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-thumb .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }

    .image-thumb .remove-btn:hover {
      background: #ff0000;
    }

    /* 用户上传图片可点击 */
    .user-upload-img {
      cursor: zoom-in;
      transition: transform 0.2s ease;
    }

    .user-upload-img:hover {
      transform: scale(1.05);
    }

    /* 截图引导面板 */
    .screenshot-guide {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn 0.2s ease;
    }

    .guide-content {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      max-width: 420px;
      width: 90%;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .guide-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--fg-secondary);
      line-height: 1;
    }

    .guide-close:hover {
      color: var(--fg-primary);
    }

    .guide-content h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .guide-desc {
      color: var(--fg-secondary);
      margin: 0 0 16px;
      font-size: 14px;
    }

    .guide-method {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .guide-method h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .guide-method ol {
      margin: 0;
      padding-left: 20px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--fg-secondary);
    }

    .guide-method kbd {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 12px;
      box-shadow: 0 1px 0 var(--border);
    }

    .guide-action {
      width: 100%;
      padding: 12px;
      background: var(--fg-primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .guide-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .guide-action.secondary {
      background: var(--bg-secondary);
      color: var(--fg-primary);
      border: 1px solid var(--border);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Lightbox 模态框 */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      animation: fadeIn 0.2s ease;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      animation: zoomIn 0.3s ease;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 状态栏 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 4px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--fg-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #28a745;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--fg-secondary);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .link-btn:hover {
      background: var(--accent);
      color: #FFFFFF;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    @media (max-width: 600px) {
      .chat-area, .input-area { padding: 16px; }
    }
  </style>

    'Hiragino Sans GB', Roboto, sans-serif;

  --font-weight-code: 450;

  --transition-normal: 0.2s ease;
  --transition-slow: 0.3s ease;

  /* ===== Z-Index Layer System ===== */
  --z-base: 0;
  --z-above: 1;
  --z-above-2: 2;

  --z-sticky: 10;
  --z-local-overlay: 100;

  --z-dropdown: 1000;
  --z-popover: 1010;

  --z-modal-backdrop: 1090;
  --z-modal: 1100;
  --z-drawer: 1120;
  --z-confirm: 1150;

  --z-notification: 1200;
  --z-tooltip: 1300;

  --z-fullscreen: 1400;

  /* 仅限基础设施 / 调试工具，业务组件禁止直接使用 */
  --z-max: 9999;
  /* GTM 是全窗口阻塞式系统弹窗，必须覆盖 IDE / Solo Lite 内所有业务浮层 */
  --z-gtm-modal: 2147483647;

<body>

  <div class="app-container">
    <!-- 左侧人物窄栏 -->
    <aside class="sidebar" style="width: 187.2px; height: 590.4px;">
      <div class="character-avatar">
        <img id="characterAvatar" src="boy.png" alt="小男孩" onerror="this.style.display='none'; this.parentNode.innerHTML='&lt;div class=&quot;avatar-placeholder&quot; style=&quot;width:100%;height:100%;&quot;&gt;男&lt;/div&gt;';">
      </div>
      
    </aside>

    <!-- 右侧主区域 -->
    <div class="main-area">
      <!-- 对话区 -->
      <div id="chatArea" class="chat-area">
        <!-- 欢迎消息 -->
        <div class="chat-bubble message-group" style="transition: transform 200ms cubic-bezier(0.2, 0, 0, 1);">
          <div class="avatar">
            <img src="boy2.png" alt="小男孩" onerror="this.style.display='none'; this.parentNode.innerHTML='&lt;div class=&quot;avatar-placeholder&quot;&gt;男&lt;/div&gt;';">
          </div>
          <div class="message-meta">
            <div class="bubble ai">
              你好！我是韦史妈妈，很高兴与你交流。请告诉我你想聊些什么？
            </div>
            <span class="timestamp">刚刚</span>
          </div>
        </div>

        <!-- 思考中 -->
        <div id="thinkingBubble" class="chat-bubble message-group hidden">
          <div class="avatar">
            <img src="boy2.png" alt="小男孩" onerror="this.style.display='none'; this.parentNode.innerHTML='&lt;div class=&quot;avatar-placeholder&quot;&gt;男&lt;/div&gt;';">
          </div>
          <div class="thinking-bubble">
            <span class="thinking-dot w-1.5 h-1.5 rounded-full" style="background: var(--fg-secondary);"></span>
            <span class="thinking-dot w-1.5 h-1.5 rounded-full" style="background: var(--fg-secondary);"></span>
            <span class="thinking-dot w-1.5 h-1.5 rounded-full" style="background: var(--fg-secondary);"></span>
          </div>
        </div>
      </div>

      <!-- 输入区 -->
      <div class="input-area">
        <!-- 图片预览区 -->
        <div id="imagePreviewArea" class="image-preview-area"></div>
        
        <div class="input-container">
          <div class="add-btn-container">
            <button class="add-btn" id="addBtn" title="添加">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <div class="popup-menu" id="popupMenu">
              <div class="popup-arrow"></div>
              <label class="popup-item" for="imageInput">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>上传图片</span>
                <input type="file" id="imageInput" accept="image/*" multiple>
              </label>
              <button class="popup-item" id="screenshotBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span>截屏提问</span>
              </button>
            </div>
          </div>
          <textarea id="messageInput" class="input-field" placeholder="输入消息..." rows="1" aria-label="消息输入框" style="height: 45px;"></textarea>
          <button id="sendBtn" class="send-btn" aria-label="发送消息">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
          <a href="https://18156327558.github.io" class="link-btn" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>

            <span id="statusText">就绪</span>
          </div>
        </div>

  <script>
    // ===== API 配置 =====
    const API_BASE = 'https://gen.pollinations.ai/v1';
    const API_KEY  = 'sk_eRMBgnfo3X3M2yLCPYHetWZtpnerB3Lo';
    const MODEL    = 'YoannDev90/diffusiongemma-26b-a4b-it:free';

    // ===== Marked 配置 + KaTeX =====
    // 自定义 marked 扩展来支持 KaTeX 数学公式
    const renderer = new marked.Renderer();
    const originalCode = renderer.code.bind(renderer);
    
    renderer.code = function(code, language) {
      if (language === 'math' || language === 'latex') {
        try {
          return katex.renderToString(code, { throwOnError: false, displayMode: true });
        } catch (e) {
          return '<code>' + code + '</code>';
        }
      }
      return originalCode(code, language);
    };

    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false,
      renderer: renderer
    });

    // 处理 $...$ 和 $$...$$ 数学公式的后处理
    function renderMathInText(html) {
      // 先处理 $$...$$ (块级数学)
      html = html.replace(/\$\$([\s\S]*?)\$\$/g, function(match, tex) {
        try {
          return katex.renderToString(tex.trim(), { throwOnError: false, displayMode: true });
        } catch (e) {
          return match;
        }
      });
      
      // 再处理 $...$ (行内数学)
      html = html.replace(/\$([^\$]+?)\$/g, function(match, tex) {
        try {
          return katex.renderToString(tex.trim(), { throwOnError: false, displayMode: false });
        } catch (e) {
          return match;
        }
      });
      
      return html;
    }

    // DOM
    const messageInput = document.getElementById('messageInput');
    const sendBtn      = document.getElementById('sendBtn');
    const chatArea     = document.getElementById('chatArea');
    const thinkingBubble = document.getElementById('thinkingBubble');
    const statusDot    = document.getElementById('statusDot');
    const statusText   = document.getElementById('statusText');
    const imageInput   = document.getElementById('imageInput');
    const imagePreviewArea = document.getElementById('imagePreviewArea');

    // 状态
    let isRequesting = false;
    let selectedImages = []; // { id, url, file }

    // 设置状态
    function setStatus(text, dotColor) {
      statusText.textContent = text;
      if (dotColor) {
        statusDot.style.background = dotColor;
      }
    }

    // 图片选择处理
    function handleImageSelect(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (file.type.startsWith('image/')) {
          const url = URL.createObjectURL(file);
          selectedImages.push({
            id: Date.now() + Math.random(),
            url: url,
            file: file
          });
        }
      });
      renderImagePreview();
      e.target.value = '';
    }

    // 渲染图片预览
    function renderImagePreview() {
      imagePreviewArea.innerHTML = '';
      selectedImages.forEach(img => {
        const thumb = document.createElement('div');
        thumb.className = 'image-thumb';
        thumb.innerHTML = `
          <img src="${img.url}" alt="预览图片">
          <button class="remove-btn" data-id="${img.id}" title="移除">×</button>
        `;
        imagePreviewArea.appendChild(thumb);
      });
      
      if (selectedImages.length > 0) {
        imagePreviewArea.classList.add('active');
      } else {
        imagePreviewArea.classList.remove('active');
      }
    }

    // 移除图片
    function removeImage(id) {
      const imgIndex = selectedImages.findIndex(img => img.id === id);
      if (imgIndex !== -1) {
        URL.revokeObjectURL(selectedImages[imgIndex].url);
        selectedImages.splice(imgIndex, 1);
        renderImagePreview();
      }
    }

    // 自适应高度
    function autoResize() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    }

    // 发送消息
    async function sendMessage() {
      const text = messageInput.value.trim();
      if ((!text && selectedImages.length === 0) || isRequesting) return;

      // 将图片转为base64保存，避免revoke后失效
      const imagesData = [];
      for (const img of selectedImages) {
        const base64 = await fileToBase64(img.file);
        imagesData.push({
          url: `data:${img.file.type};base64,${base64}`,
          file: img.file,
          base64: base64,
          type: img.file.type
        });
      }

      // 构建用户消息的图片HTML
      let imagesHtml = '';
      if (imagesData.length > 0) {
        imagesHtml = '<div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;">';
        imagesData.forEach(img => {
          imagesHtml += `<img src="${img.url}" alt="用户上传图片" class="user-upload-img" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15);">`;
        });
        imagesHtml += '</div>';
      }

      // 用户消息
      const userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble message-group user';
      
      // 构建气泡内容 - 图片和文字包在同一个气泡里
      let bubbleContent = '';
      if (imagesHtml || text) {
        bubbleContent = `
          <div class="bubble user">
            ${imagesHtml}
            ${text ? `<p style="margin: 8px 0 0;">${escapeHtml(text)}</p>` : ''}
          </div>
        `;
      }
      
      userBubble.innerHTML = `
        <div class="message-meta">
          ${bubbleContent}
          <span class="timestamp">刚刚</span>
        </div>
      `;
      chatArea.appendChild(userBubble);
      messageInput.value = '';
      autoResize();

      // 清空已发送的图片（UI）
      selectedImages.forEach(img => URL.revokeObjectURL(img.url));
      selectedImages = [];
      renderImagePreview();

      // 显示思考中
      thinkingBubble.classList.remove('hidden');
      setStatus('请求中...', '#FFA500');
      scrollToBottom();

      try {
        isRequesting = true;
        sendBtn.disabled = true;

        // 构建消息内容（包含图片）
        let userContent;
        if (imagesData.length > 0 || text) {
          const parts = [];
          if (text) {
            parts.push({ type: 'text', text: text });
          }
          for (const img of imagesData) {
            parts.push({
              type: 'image_url',
              image_url: {
                url: `data:${img.type};base64,${img.base64}`
              }
            });
          }
          userContent = parts.length > 1 ? parts : (text || '用户上传了图片');
        } else {
          userContent = text;
        }

        const res = await fetch(`${API_BASE}/chat/completions`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: 'system',
                content: '你是"韦史妈妈"，一个温暖、有耐心的中文助手。请用自然、亲切的口吻回复。'
              },
              {
                role: 'user',
                content: userContent
              }
            ]
          })
        });

        if (!res.ok) {
          const errText = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status} ${res.statusText} ${errText}`.trim());
        }

        const data = await res.json();
        const content = data?.choices?.[0]?.message?.content || '（模型未返回内容）';

        // 回复消息
        const replyBubble = document.createElement('div');
        replyBubble.className = 'chat-bubble message-group';
        
        // 使用 marked 解析 Markdown + KaTeX 渲染数学公式
        let renderedContent = marked.parse(content);
        renderedContent = renderMathInText(renderedContent);
        
        replyBubble.innerHTML = `
          <div class="avatar">
            <img src="boy2.png" 
                 alt="小男孩"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=&quot;avatar-placeholder&quot;>男</div>';">
          </div>
          <div class="message-meta">
            <div class="bubble ai">${renderedContent}</div>
            <span class="timestamp">刚刚</span>
          </div>
        `;
        chatArea.appendChild(replyBubble);

        setStatus('就绪', '#28a745');
      } catch (err) {
        console.error(err);

        const errorBubble = document.createElement('div');
        errorBubble.className = 'chat-bubble message-group';
        errorBubble.innerHTML = `
          <div class="avatar">
            <img src="boy2.png" 
                 alt="小男孩"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=&quot;avatar-placeholder&quot;>男</div>';">
          </div>
          <div class="message-meta">
            <div class="bubble error">请求失败：${escapeHtml(err.message)}</div>
            <span class="timestamp">刚刚</span>
          </div>
        `;
        chatArea.appendChild(errorBubble);

        setStatus('请求失败', '#FF0000');
      } finally {
        isRequesting = false;
        sendBtn.disabled = false;
        thinkingBubble.classList.add('hidden');
        scrollToBottom();
      }
    }

    // 滚动到底部
    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 文件转 Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 事件绑定
    sendBtn.addEventListener('click', sendMessage);
    
    messageInput.addEventListener('input', autoResize);
    
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    imageInput.addEventListener('change', handleImageSelect);

    // 截屏功能 - 使用屏幕捕获API
    const screenshotBtn = document.getElementById('screenshotBtn');
    
    // 检测是否支持屏幕捕获
    function canUseScreenCapture() {
      return navigator.mediaDevices && 
             navigator.mediaDevices.getDisplayMedia && 
             window.isSecureContext;
    }

    screenshotBtn.addEventListener('click', async () => {
      popupMenu.classList.remove('active');
      
      // 检查是否支持
      if (!canUseScreenCapture()) {
        // 显示友好提示
        showScreenshotGuide('unsupported');
        return;
      }

      try {
        // 请求屏幕捕获权限
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { 
            cursor: 'always',
            frameRate: 30
          },
          audio: false
        });

        // 如果用户在选择后立即停止了共享（点击了停止按钮）
        stream.getVideoTracks()[0].addEventListener('ended', () => {
          showScreenshotGuide('stopped');
        });

        // 创建视频元素用于捕获
        const video = document.createElement('video');
        video.srcObject = stream;
        
        // 等待视频加载
        await new Promise((resolve, reject) => {
          video.onloadedmetadata = () => resolve();
          video.onerror = () => reject(new Error('视频加载失败'));
          setTimeout(() => reject(new Error('加载超时')), 5000);
        });
        
        video.play();

        // 等待一帧渲染
        await new Promise(resolve => requestAnimationFrame(resolve));

        // 创建Canvas并截图
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1920;
        canvas.height = video.videoHeight || 1080;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 停止屏幕捕获
        stream.getTracks().forEach(track => track.stop());

        // 转换为文件并添加到图片列表
        const blob = await new Promise(resolve => {
          canvas.toBlob(resolve, 'image/png', 0.95);
        });

        if (blob) {
          const file = new File([blob], `screenshot_${Date.now()}.png`, { type: 'image/png' });
          const url = URL.createObjectURL(blob);
          selectedImages.push({
            id: Date.now() + Math.random(),
            url: url,
            file: file
          });
          renderImagePreview();
        } else {
          throw new Error('图片生成失败');
        }

      } catch (err) {
        console.error('截屏失败:', err);
        
        if (err.name === 'NotAllowedError' || err.name === 'NotReadableError') {
          showScreenshotGuide('denied');
        } else if (err.name === 'NotFoundError') {
          alert('未找到可用的屏幕或窗口。');
        } else if (err.message === '加载超时' || err.message === '视频加载失败') {
          alert('屏幕捕获超时，请重试。');
        } else {
          alert('截屏失败：' + err.message);
        }
      }
    });

    // 显示截图引导面板
    function showScreenshotGuide(type) {
      const messages = {
        unsupported: {
          title: '截屏失败',
          desc: '当前环境不支持直接截屏（需要 HTTPS 或 localhost）。请使用以下方法：'
        },
        denied: {
          title: '截屏失败',
          desc: ''
        },
        stopped: {
          title: '截屏失败',
          desc: ''
        }
      };
      
      const msg = messages[type] || messages.unsupported;
      
      // 创建引导面板
      const panel = document.createElement('div');
      panel.className = 'screenshot-guide';
      panel.innerHTML = `
        <div class="guide-content">
          <button class="guide-close">&times;</button>
          <h3>${msg.title}</h3>
          <p class="guide-desc">${msg.desc}</p>
          
          <div class="guide-method">
            <h4>📸 方法一：快捷键截图（推荐）</h4>
            <ol>
              <li>按 <kbd>Win</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd></li>
              <li>拖拽选择截图区域</li>
              <li>截图自动复制到剪贴板</li>
              <li>回到本页面，按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴</li>
            </ol>
          </div>
          
          <div class="guide-method">
            <h4>🖼️ 方法二：上传已保存的截图</h4>
            <ol>
              <li>按 <kbd>Win</kbd> + <kbd>Print Screen</kbd> 全屏截图</li>
              <li>点击下方"上传图片"按钮</li>
              <li>选择保存的截图文件</li>
            </ol>
          </div>
          
          <button class="guide-action" id="pasteBtn">📋 立即粘贴图片 (Ctrl+V)</button>
          <button class="guide-action secondary" id="uploadBtn">📤 上传图片</button>
        </div>
      `;
      
      document.body.appendChild(panel);
      
      // 绑定事件
      panel.querySelector('.guide-close').onclick = () => panel.remove();
      panel.querySelector('#pasteBtn').onclick = () => {
        panel.remove();
        messageInput.focus();
        document.execCommand('paste');
      };
      panel.querySelector('#uploadBtn').onclick = () => {
        panel.remove();
        imageInput.click();
      };
      
      // 点击背景关闭
      panel.addEventListener('click', (e) => {
        if (e.target === panel) panel.remove();
      });
    }

    // 截图帮助页面（降级方案）
    function openScreenshotHelper() {
      const helper = window.open('', '_blank');
      helper.document.write(`
        <html>
        <head>
          <title>截图帮助</title>
          <style>
            body { font-family: -apple-system, 'Noto Sans SC', sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; }

            h2 { color: #555; font-size: 18px; }
            kbd { background: #333; color: white; padding: 4px 10px; border-radius: 4px; font-family: monospace; }
            ol { line-height: 1.8; }
            button { padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
            button:hover { background: #555; }
          </style>
        </head>
        <body>
          <h1>📸 如何截屏</h1>
          
          <div class="method">

              <li>拖拽选择截图区域</li>
              <li>截图会自动复制到剪贴板</li>
              <li>点击下方"粘贴图片"按钮</li>
            </ol>
          </div>

          <div class="method">
            <h2>方法二：Win + Print Screen</h2>
            <ol>
              <li>按 <kbd>Win</kbd> + <kbd>Print Screen</kbd></li>
              <li>全屏截图会自动保存</li>
              <li>打开"此电脑 → 图片 → 屏幕截图"找到图片</li>
              <li>点击下方"上传图片"按钮选择截图</li>
            </ol>
          </div>

          <button onclick="document.getElementById('fileInput').click()">📤 上传刚才的截图</button>
          <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)" style="display:none;">

          <script>
            function handleFile(e) {
              const file = e.target.files[0];
              if (file) {
                const url = URL.createObjectURL(file);
                window.opener.postMessage({ type: 'screenshot', url: url, name: file.name }, '*');
                setTimeout(() => window.close(), 500);
              }
            }
          <\/script>
        </body>
        </html>
      `);
      helper.document.close();
    }

    // 接收来自截图帮助页面的图片
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'screenshot') {
        fetch(e.data.url)
          .then(res => res.blob())
          .then(blob => {
            const file = new File([blob], e.data.name || 'screenshot.png', { type: 'image/png' });
            const url = URL.createObjectURL(blob);
            selectedImages.push({
              id: Date.now() + Math.random(),
              url: url,
              file: file
            });
            renderImagePreview();
          });
      }
    });

    // 弹出菜单控制
    const addBtn = document.getElementById('addBtn');
    const popupMenu = document.getElementById('popupMenu');

    addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      popupMenu.classList.toggle('active');
    });

    // 点击其他位置关闭弹出菜单
    document.addEventListener('click', (e) => {
      if (!addBtn.closest('.add-btn-container').contains(e.target)) {
        popupMenu.classList.remove('active');
      }
    });

    // 文件选择后关闭菜单
    imageInput.addEventListener('click', () => popupMenu.classList.remove('active'));

    // 剪贴板粘贴功能 - 在输入框粘贴图片
    messageInput.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          const url = URL.createObjectURL(file);
          selectedImages.push({
            id: Date.now() + Math.random(),
            url: url,
            file: file
          });
          renderImagePreview();
          break;
        }
      }
    });

    // 全局粘贴支持
    document.addEventListener('paste', (e) => {
      // 只有当焦点不在输入框时才处理
      if (document.activeElement !== messageInput) {
        const items = e.clipboardData?.items;
        if (items) {
          for (const item of items) {
            if (item.type.startsWith('image/')) {
              const file = item.getAsFile();
              const url = URL.createObjectURL(file);
              selectedImages.push({
                id: Date.now() + Math.random(),
                url: url,
                file: file
              });
              renderImagePreview();
              break;
            }
          }
        }
      }
    });

    imagePreviewArea.addEventListener('click', (e) => {
      if (e.target.classList.contains('remove-btn')) {
        const id = parseFloat(e.target.dataset.id);
        removeImage(id);
      }
    });

    // 初始状态
    setStatus('就绪', '#28a745');
    autoResize();

    // ===== Lightbox 图片放大功能 =====
    const lightbox = document.createElement('div');
    lightbox.className = 'lightbox';
    lightbox.innerHTML = `
      <button class="lightbox-close" title="关闭">&times;</button>
      <img src="" alt="放大查看">
    `;
    document.body.appendChild(lightbox);

    const lightboxImg = lightbox.querySelector('img');
    const lightboxClose = lightbox.querySelector('.lightbox-close');

    // 点击用户上传图片放大
    chatArea.addEventListener('click', (e) => {
      if (e.target.classList.contains('user-upload-img')) {
        lightboxImg.src = e.target.src;
        lightbox.classList.add('active');
      }
    });

    // 关闭lightbox
    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeLightbox();
      }
